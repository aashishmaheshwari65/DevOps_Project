# -----------------------------------------------------------------------------
# Nginx site for Ubuntu EC2. Place in /etc/nginx/sites-available/ and symlink:
#   sudo ln -s /etc/nginx/sites-available/smart-file-share /etc/nginx/sites-enabled/
# Adjust `server_name` to your domain or public IP. TLS is recommended (Certbot).
#
# This proxies all traffic to the Node app (Docker on 127.0.0.1:3000 or systemd).
# -----------------------------------------------------------------------------

# Increase if users upload large files (must match or exceed your Express/multer limit)
client_max_body_size 50M;

# Upstream: Node/Express (listens in Docker on host port 3000)
upstream smart_file_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    # Replace with your domain, or _ for "catch-all" in development
    server_name _;

    location / {
        proxy_pass http://smart_file_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / long polling (not required for this app, harmless)
        proxy_set_header Connection "";
    }
}

