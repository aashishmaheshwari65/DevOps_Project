# -----------------------------------------------------------------------------
# GitHub Actions: install → build → deploy to EC2 over SSH
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST     — public IP or DNS of the instance
#   EC2_USER     — must match the AMI login, e.g. ec2-user (Amazon Linux) or ubuntu (Ubuntu)
#   EC2_SSH_KEY  — full private key (.pem) including BEGIN/END lines
# Optional:
#   DEPLOY_DIR   — absolute path on server; default: /home/$EC2_USER/smart-file-share
#   EC2_ENV_FILE — full multiline .env (production). If unset, a .env file must already exist on the server
#                 (not in git; rsync does not remove existing .env)
# -----------------------------------------------------------------------------

name: Build and deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install and build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: "github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "EC2_SSH_KEY secret is empty — configure deploy secrets in the repo to enable SSH."
            exit 0
          fi
          printf '%s' "$EC2_SSH_KEY" > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"

      - name: Rsync project to server
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_DIR_SECRET: ${{ secrets.DEPLOY_DIR }}
        run: |
          if [ -z "$EC2_SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$EC2_USER" ]; then
            echo "Missing EC2_SSH_KEY, EC2_HOST, or EC2_USER — skipping deploy. Build job still passed."
            exit 0
          fi
          REMOTE_DIR="${DEPLOY_DIR_SECRET}"
          if [ -z "$REMOTE_DIR" ]; then
            REMOTE_DIR="/home/${EC2_USER}/smart-file-share"
          fi
          ssh -i "$RUNNER_TEMP/key" -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${HOST}" "mkdir -p '$REMOTE_DIR'"
          rsync -avz --delete \
            -e "ssh -i $RUNNER_TEMP/key -o StrictHostKeyChecking=accept-new" \
            --exclude 'node_modules' --exclude '.git' --exclude 'frontend/node_modules' --exclude 'backend/node_modules' \
            --exclude '.env' \
            ./ "${EC2_USER}@${HOST}:$REMOTE_DIR/"

      - name: Write .env on EC2 from secret (optional)
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_DIR_SECRET: ${{ secrets.DEPLOY_DIR }}
          EC2_ENV_FILE: ${{ secrets.EC2_ENV_FILE }}
        run: |
          if [ -z "$EC2_SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$EC2_USER" ]; then
            exit 0
          fi
          REMOTE_DIR="${DEPLOY_DIR_SECRET}"
          if [ -z "$REMOTE_DIR" ]; then
            REMOTE_DIR="/home/${EC2_USER}/smart-file-share"
          fi
          if [ -n "$EC2_ENV_FILE" ]; then
            printf '%s' "$EC2_ENV_FILE" | ssh -i "$RUNNER_TEMP/key" -o StrictHostKeyChecking=accept-new \
              "${EC2_USER}@${HOST}" "mkdir -p \"${REMOTE_DIR}\" && cat > \"${REMOTE_DIR}/.env\" && chmod 600 \"${REMOTE_DIR}/.env\""
            echo "Wrote .env to $REMOTE_DIR from EC2_ENV_FILE secret."
          else
            echo "EC2_ENV_FILE is not set — checking for an existing .env on the server..."
            ssh -i "$RUNNER_TEMP/key" -o StrictHostKeyChecking=accept-new \
              "${EC2_USER}@${HOST}" "test -f \"${REMOTE_DIR}/.env\"" || {
                echo "::error::No .env on the server and no EC2_ENV_FILE secret. Add GitHub secret EC2_ENV_FILE (full .env), or create ${REMOTE_DIR}/.env (see README). Also verify EC2_USER matches the server (e.g. ec2-user vs ubuntu)."
                exit 1
              }
            echo "Found existing .env on server."
          fi

      - name: Ensure Docker buildx on EC2 (fixes Amazon Linux 2023)
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_DIR_SECRET: ${{ secrets.DEPLOY_DIR }}
        run: |
          if [ -z "$EC2_SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$EC2_USER" ]; then
            exit 0
          fi
          REMOTE_DIR="${DEPLOY_DIR_SECRET}"
          if [ -z "$REMOTE_DIR" ]; then
            REMOTE_DIR="/home/${EC2_USER}/smart-file-share"
          fi
          ssh -i "$RUNNER_TEMP/key" -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${HOST}" "bash -s" < scripts/ensure-buildx.sh
          # Note: run from runner checkout; uses sudo on the instance (default for ec2-user on EC2)

      - name: Remote docker compose
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_DIR_SECRET: ${{ secrets.DEPLOY_DIR }}
        run: |
          if [ -z "$EC2_SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$EC2_USER" ]; then
            exit 0
          fi
          REMOTE_DIR="${DEPLOY_DIR_SECRET}"
          if [ -z "$REMOTE_DIR" ]; then
            REMOTE_DIR="/home/${EC2_USER}/smart-file-share"
          fi
          # EC2 must have Docker Engine + "docker compose" (Compose V2 plugin). If you see "docker: command not found", install Docker on the instance (README).
          ssh -i "$RUNNER_TEMP/key" -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${HOST}" \
            "set -e; export PATH=\"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\" ; cd \"${REMOTE_DIR}\" && if [ ! -f .env ]; then echo '::error::Missing .env. SSH once and create it, or set repository secret EC2_ENV_FILE (full file contents).'; exit 1; fi; if ! command -v docker >/dev/null 2>&1; then echo '::error::Install Docker on EC2 (get.docker.com), then re-run. See project README.'; exit 127; fi; export COMPOSE_BAKE=0; docker compose --env-file .env build --progress=plain; docker compose --env-file .env up -d"
